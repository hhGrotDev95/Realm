name: Owner portal

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'owner-portal/**'
      - 'docs/PROJECT_STATUS.json'
      - 'docs/WINTER_RELEASE_PLAN.md'
      - 'REALM_PROGRESS.md'
      - 'package*.json'
      - 'worker/package*.json'
      - '.github/workflows/owner-portal.yml'

permissions:
  contents: read

concurrency:
  group: realm-owner-portal-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm run build:owner
      - run: npm run test:owner
      - run: npx playwright install --with-deps chromium
      - run: npm run test:owner:ui
      - name: Bundle without credentials or deployment
        run: worker/node_modules/.bin/wrangler deploy --config owner-portal/wrangler.toml --dry-run --outdir /tmp/realm-owner-bundle

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://realm-project-status.heidlhannes95.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run build:owner
      - name: Skip a superseded source commit
        id: current
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$current_main" ]; then
            echo 'A newer main commit exists; keeping the current dashboard.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Deploy only the separate private status Worker
        if: steps.current.outputs.deploy == 'true'
        run: worker/node_modules/.bin/wrangler deploy --config owner-portal/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify anonymous and forged-identity denial
        if: steps.current.outputs.deploy == 'true'
        run: npm run check:owner
      - name: Record publication
        if: steps.current.outputs.deploy == 'true'
        run: |
          echo 'Private status: https://realm-project-status.heidlhannes95.workers.dev' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Anonymous denial checked; authenticated owner access is configured separately.' >> "$GITHUB_STEP_SUMMARY"
