name = "realm-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Comma-separated list of allowed browser origins ("*" for any).
[vars]
ALLOWED_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "realm"
# Replace with the id printed by `wrangler d1 create realm` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["17 * * * *"]

# Development preview: static app and API share one origin; production is separate.
[env.staging]
name = "realm-staging"
account_id = "f18ed22dbd7c2e62aec7e68cb0d1eeb7"
workers_dev = true
preview_urls = false

[env.staging.assets]
directory = "../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.staging.vars]
ALLOWED_ORIGINS = "https://realm-staging.heidlhannes95.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "realm-staging"
database_id = "947f8345-e036-4c74-aebb-924ae151fa39"
migrations_dir = "migrations"

[env.staging.triggers]
crons = ["17 * * * *"]
